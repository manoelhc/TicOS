name: CI Validation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name: Setup Packer
      uses: hashicorp/setup-packer@main
      with:
        version: 'latest'
    
    - name: Initialize Packer
      run: packer init .
    
    - name: Validate Packer Configuration
      run: packer validate packer.pkr.hcl
    
    - name: Check Packer Formatting
      run: packer fmt -check packer.pkr.hcl
    
    - name: Validate Shell Scripts Syntax
      run: |
        for script in scripts/*.sh setup.sh; do
          echo "Checking $script..."
          bash -n "$script"
        done
    
    - name: Install ShellCheck
      run: sudo apt-get update && sudo apt-get install -y shellcheck
    
    - name: Run ShellCheck
      run: |
        shellcheck scripts/*.sh setup.sh || true
    
    - name: Check Documentation Links
      run: |
        echo "Checking for broken links in documentation..."
        # Basic check that referenced files exist
        test -f QUICKSTART.md
        test -f SECURITY.md
        test -f TROUBLESHOOTING.md
        test -f CONTRIBUTING.md
        test -f examples/README.md
